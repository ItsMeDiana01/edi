<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LENSY PHOTOBOOTH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Shutter Button Animation */
        .shutter-btn { transition: all 0.15s ease-in-out; }
        .shutter-btn:active { transform: scale(0.92); }
        
        /* Efek Flash & Countdown */
        .flash-overlay {
            position: absolute; inset: 0; background: white; z-index: 50; opacity: 0; 
            pointer-events: none; transition: opacity 0.1s ease-out;
        }
        .flash-overlay.active { opacity: 1; }
        
        .countdown-text {
            position: absolute; z-index: 40; font-size: 180px; font-weight: 800; color: white;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none;
        }
        .countdown-text.active { display: block; }
        
        /* Custom Scrollbar untuk list frame */
        .frame-scroll::-webkit-scrollbar { height: 8px; }
        .frame-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        /* Frame selection active state */
        .frame-thumb.active { border-color: #4f46e5; border-width: 4px; filter: brightness(0.9); }
    </style>
</head>
<body class="bg-[#f3f6f9] h-screen w-full overflow-hidden flex text-gray-800">

    <!-- SIDEBAR (Menu Operator) -->
    <!-- Ditambahkan: id="operator-sidebar" dan transition class -->
    <aside id="operator-sidebar" class="w-64 bg-[#111827] text-white flex flex-col justify-between h-full flex-shrink-0 relative z-30 transition-all duration-300 ease-in-out">
        <div>
            <div class="px-6 py-8 flex items-center gap-3">
                <i class="fa-solid fa-camera-retro text-2xl text-indigo-400"></i>
                <div>
                    <h1 class="font-bold text-lg tracking-wide leading-tight">LENSY</h1>
                    <p class="text-[10px] text-gray-400 tracking-widest">PHOTOBOOTH</p>
                </div>
            </div>
            
            <nav class="px-4 flex flex-col gap-2">
                <div class="px-4 py-2 text-xs font-semibold text-gray-500 mt-2">PENGATURAN OPERATOR</div>
                
                <!-- Pilih Kamera -->
                <div class="px-4 py-3 bg-gray-800/50 rounded-lg">
                    <label class="text-xs text-gray-400 block mb-1">Kamera Aktif:</label>
                    <select id="camera-select" class="w-full bg-gray-700 border-none rounded text-xs text-white p-1.5 focus:ring-1 focus:ring-indigo-500 outline-none truncate">
                        <option>Mendeteksi...</option>
                    </select>
                </div>

                <!-- Upload Frame Database -->
                <div class="px-4 py-3 bg-gray-800/50 rounded-lg mt-2">
                    <label class="text-xs text-gray-400 block mb-2">Database Frame (PNG):</label>
                    <label class="cursor-pointer bg-gray-700 hover:bg-gray-600 text-white text-xs py-2 px-3 rounded flex items-center justify-center gap-2 transition-colors">
                        <i class="fa-solid fa-plus"></i> Tambah Frame
                        <input type="file" id="frame-upload" accept="image/png" multiple class="hidden">
                    </label>
                    <p class="text-[10px] text-gray-500 mt-2 text-center" id="frame-count-info">0 Frame dimuat</p>
                </div>
            </nav>
        </div>
    </aside>

    <!-- AREA KONTEN UTAMA -->
    <main class="flex-1 flex flex-col h-full overflow-hidden p-6 relative">
        
        <!-- Tombol Toggle Sidebar Mengambang -->
        <button id="btn-toggle-sidebar" class="absolute top-6 left-6 z-50 bg-white shadow-md text-gray-700 w-10 h-10 rounded-lg flex items-center justify-center hover:bg-gray-100 transition-colors border border-gray-200" title="Toggle Sidebar">
            <i class="fa-solid fa-bars text-lg"></i>
        </button>

        <!-- ========================================== -->
        <!-- HALAMAN 1: LIVE PREVIEW (SEBELUM FOTO) -->
        <!-- ========================================== -->
        <div id="page-preview" class="flex flex-col h-full items-center justify-center relative w-full">
            
            <!-- Video Container (max-w diperbesar ke 6xl) -->
            <div class="relative w-full max-w-6xl aspect-[4/3] bg-black rounded-2xl overflow-hidden shadow-2xl flex items-center justify-center transition-all duration-300">
                <div class="absolute top-4 left-4 bg-red-600 text-white px-3 py-1 rounded-full text-xs font-bold flex items-center gap-2 z-30 shadow-lg animate-pulse">
                    <div class="w-2 h-2 rounded-full bg-white"></div> LIVE PREVIEW
                </div>

                <video id="camera-video" class="w-full h-full object-cover" autoplay playsinline></video>
                
                <div id="flash-effect" class="flash-overlay"></div>
                <div id="countdown-text" class="countdown-text">3</div>
            </div>

            <button id="btn-shutter" class="shutter-btn absolute bottom-10 bg-[#4f46e5] text-white rounded-full px-10 py-5 text-xl font-bold border-4 border-white shadow-[0_10px_30px_rgba(79,70,229,0.5)] flex items-center gap-3 hover:bg-indigo-600 z-40">
                <i class="fa-solid fa-camera"></i> AMBIL FOTO
            </button>
        </div>

        <!-- ========================================== -->
        <!-- HALAMAN 2: RESULT & PILIH FRAME -->
        <!-- ========================================== -->
        <div id="page-result" class="hidden flex gap-6 h-full w-full">
            
            <!-- Kiri: Preview Hasil Akhir -->
            <div class="flex-1 flex flex-col items-center justify-center bg-white rounded-2xl shadow-sm border border-gray-200 p-6 relative">
                <!-- Header Hasil Foto digeser sedikit ke kanan (left-20) agar tidak tertimpa tombol toggle -->
                <h2 class="text-lg font-bold text-gray-800 mb-4 self-start absolute top-6 left-20">Hasil Foto</h2>
                
                <!-- Container Foto + Frame Overlays -->
                <div class="relative w-full max-w-3xl aspect-[4/3] bg-gray-100 rounded-lg overflow-hidden shadow-inner mt-8">
                    <img id="raw-photo" class="absolute inset-0 w-full h-full object-cover" src="" alt="Raw Capture">
                    <img id="active-frame-overlay" class="absolute inset-0 w-full h-full object-fill pointer-events-none hidden" src="" alt="Active Frame">
                </div>
            </div>

            <!-- Kanan: Panel Pilihan Frame & Aksi -->
            <div class="w-[340px] flex-shrink-0 bg-white rounded-2xl shadow-sm border border-gray-200 p-6 flex flex-col">
                <h3 class="font-bold text-gray-800 text-lg mb-1">Pilih Frame</h3>
                <p class="text-sm text-gray-500 mb-4">Pilih desain frame untuk fotomu.</p>
                
                <div id="frame-gallery" class="flex-1 overflow-y-auto frame-scroll grid grid-cols-2 gap-3 pr-2 mb-6 content-start">
                    <div class="col-span-2 text-center py-10 text-gray-400 text-sm italic" id="empty-frame-msg">
                        Belum ada frame.<br>Minta operator mengunggah frame.
                    </div>
                </div>

                <div class="flex flex-col gap-3 mt-auto pt-4 border-t border-gray-100">
                    <button id="btn-save" class="w-full bg-[#4f46e5] text-white py-3.5 rounded-xl font-bold shadow-lg hover:bg-indigo-600 flex justify-center items-center gap-2 transition-colors text-lg">
                        <i class="fa-solid fa-download"></i> Simpan Foto
                    </button>
                    <button id="btn-retake" class="w-full bg-white border-2 border-gray-200 text-gray-700 py-3 rounded-xl font-medium hover:bg-gray-50 flex justify-center items-center gap-2 transition-colors">
                        <i class="fa-solid fa-rotate-right"></i> Foto Ulang
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script>
        // DOM Elements
        const operatorSidebar = document.getElementById('operator-sidebar');
        const btnToggleSidebar = document.getElementById('btn-toggle-sidebar');
        const iconToggle = btnToggleSidebar.querySelector('i');
        
        const pagePreview = document.getElementById('page-preview');
        const pageResult = document.getElementById('page-result');
        
        const video = document.getElementById('camera-video');
        const cameraSelect = document.getElementById('camera-select');
        const btnShutter = document.getElementById('btn-shutter');
        const countdownText = document.getElementById('countdown-text');
        const flashEffect = document.getElementById('flash-effect');
        
        const frameUpload = document.getElementById('frame-upload');
        const frameCountInfo = document.getElementById('frame-count-info');
        const frameGallery = document.getElementById('frame-gallery');
        const emptyFrameMsg = document.getElementById('empty-frame-msg');
        
        const rawPhotoImg = document.getElementById('raw-photo');
        const activeFrameOverlay = document.getElementById('active-frame-overlay');
        
        const btnSave = document.getElementById('btn-save');
        const btnRetake = document.getElementById('btn-retake');

        let currentStream = null;
        let loadedFrames = [];
        let currentRawPhotoData = null;
        let selectedFrameIndex = null;
        let imageCapture = null; 

        // ==========================================
        // 0. FITUR TOGGLE SIDEBAR
        // ==========================================
        btnToggleSidebar.addEventListener('click', () => {
            // Menggunakan margin-left negatif sebesar lebar sidebar (-16rem / -256px) 
            // untuk mengeluarkan sidebar dari layar secara animasi
            operatorSidebar.classList.toggle('-ml-64');
            
            // Ubah icon tombol
            if (operatorSidebar.classList.contains('-ml-64')) {
                iconToggle.classList.replace('fa-bars', 'fa-chevron-right');
            } else {
                iconToggle.classList.replace('fa-chevron-right', 'fa-bars');
            }
        });

        // ==========================================
        // 1. SETUP KAMERA (MENDUKUNG HARDWARE SENSOR API)
        // ==========================================
        async function initCamera(deviceId = null) {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const videoConstraints = {
                width: { ideal: 1920 },
                height: { ideal: 1080 },
                ...(deviceId ? { deviceId: { exact: deviceId } } : { facingMode: 'user' })
            };

            const constraints = { 
                video: videoConstraints, 
                audio: false 
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                
                const track = currentStream.getVideoTracks()[0];
                if ('ImageCapture' in window) {
                    imageCapture = new ImageCapture(track);
                    console.log("✅ ImageCapture API aktif. Siap untuk foto resolusi tinggi.");
                } else {
                    console.warn("⚠️ Browser tidak mendukung ImageCapture. Akan kembali menggunakan Canvas.");
                    imageCapture = null;
                }

                if (!deviceId) await populateCameraList();

            } catch (err) {
                console.warn("Kamera menolak batas resolusi, mencoba fallback...", err);
                fallbackCamera(deviceId);
            }
        }

        async function fallbackCamera(deviceId) {
            const fallbackConstraints = {
                video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: 'user' },
                audio: false
            };
            try {
                currentStream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
                video.srcObject = currentStream;
            } catch (err) {
                alert("Kamera benar-benar tidak bisa diakses: " + err.message);
            }
        }

        async function populateCameraList() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');
                cameraSelect.innerHTML = '';
                videoDevices.forEach((device, index) => {
                    const opt = document.createElement('option');
                    opt.value = device.deviceId;
                    opt.text = device.label || `Kamera ${index + 1}`;
                    cameraSelect.appendChild(opt);
                });
            } catch (error) { console.error(error); }
        }

        cameraSelect.addEventListener('change', (e) => initCamera(e.target.value));

        // ==========================================
        // 2. OPERATOR: UPLOAD FRAME 
        // ==========================================
        frameUpload.addEventListener('change', (e) => {
            const files = e.target.files;
            if (!files.length) return;

            emptyFrameMsg.style.display = 'none';

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const src = event.target.result;
                    loadedFrames.push(src);
                    
                    const thumbIdx = loadedFrames.length - 1;
                    const imgEl = document.createElement('img');
                    imgEl.src = src;
                    imgEl.className = 'w-full aspect-[4/3] object-cover bg-gray-100 rounded-lg cursor-pointer border-2 border-transparent hover:border-indigo-300 transition-all frame-thumb shadow-sm';
                    
                    imgEl.addEventListener('click', () => applyFrame(thumbIdx, imgEl));
                    
                    frameGallery.appendChild(imgEl);
                    frameCountInfo.innerText = `${loadedFrames.length} Frame dimuat`;
                };
                reader.readAsDataURL(file);
            });
            e.target.value = ''; 
        });

        // ==========================================
        // 3. FUNGSI PILIH FRAME
        // ==========================================
        function applyFrame(index, imgElement) {
            selectedFrameIndex = index;
            document.querySelectorAll('.frame-thumb').forEach(el => el.classList.remove('active'));
            imgElement.classList.add('active');
            activeFrameOverlay.src = loadedFrames[index];
            activeFrameOverlay.classList.remove('hidden');
        }

        // ==========================================
        // 4. CAPTURE FOTO
        // ==========================================
        btnShutter.addEventListener('click', () => {
            btnShutter.disabled = true;
            let count = 3;
            countdownText.innerText = count;
            countdownText.classList.add('active');

            const interval = setInterval(async () => {
                count--;
                if (count > 0) {
                    countdownText.innerText = count;
                } else {
                    clearInterval(interval);
                    countdownText.classList.remove('active');
                    
                    flashEffect.classList.add('active');
                    setTimeout(() => flashEffect.classList.remove('active'), 150);

                    try {
                        if (imageCapture) {
                            const blob = await imageCapture.takePhoto();
                            currentRawPhotoData = URL.createObjectURL(blob);
                        } else {
                            const canvas = document.createElement('canvas');
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                            currentRawPhotoData = canvas.toDataURL('image/png'); 
                        }
                        rawPhotoImg.src = currentRawPhotoData;
                    } catch (error) {
                        console.error("Gagal mengambil foto HD:", error);
                    }

                    pagePreview.classList.add('hidden');
                    pageResult.classList.remove('hidden');
                    
                    activeFrameOverlay.classList.add('hidden');
                    document.querySelectorAll('.frame-thumb').forEach(el => el.classList.remove('active'));
                    selectedFrameIndex = null;
                    
                    btnShutter.disabled = false;
                }
            }, 1000);
        });

        // ==========================================
        // 5. FOTO ULANG (RETAKE)
        // ==========================================
        btnRetake.addEventListener('click', () => {
            pageResult.classList.add('hidden');
            pagePreview.classList.remove('hidden');
        });

        // ==========================================
        // 6. SIMPAN (MERGE RAW PHOTO + FRAME KE PNG)
        // ==========================================
        btnSave.addEventListener('click', () => {
            btnSave.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';
            
            const canvas = document.createElement('canvas');
            canvas.width = rawPhotoImg.naturalWidth; 
            canvas.height = rawPhotoImg.naturalHeight;
            const ctx = canvas.getContext('2d');

            ctx.drawImage(rawPhotoImg, 0, 0, canvas.width, canvas.height);

            if (selectedFrameIndex !== null) {
                const frameImgObj = new Image();
                frameImgObj.src = loadedFrames[selectedFrameIndex];
                
                frameImgObj.onload = () => {
                    ctx.drawImage(frameImgObj, 0, 0, canvas.width, canvas.height);
                    triggerDownload(canvas);
                };
            } else {
                triggerDownload(canvas);
            }
        });

        function triggerDownload(canvas) {
            const finalData = canvas.toDataURL('image/png');
            const a = document.createElement('a');
            a.href = finalData;
            
            const now = new Date();
            const pad = n => n.toString().padStart(2, '0');
            a.download = `LENSY_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}.png`;
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            btnSave.innerHTML = '<i class="fa-solid fa-download"></i> Simpan Foto';
        }

        // Mulai
        initCamera();
    </script>
</body>
</html>
